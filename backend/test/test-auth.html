<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Authentication</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-section {
            background: #f5f5f5;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        input, button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            background: #fff;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 10px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .error {
            background: #ffebee;
            border-color: #f44336;
            color: #c62828;
        }
        .success {
            background: #e8f5e9;
            border-color: #4caf50;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <h1>🔐 Test Authentication API</h1>
    
    <div class="form-section">
        <h2>Đăng ký (Register)</h2>
        <input type="text" id="reg_full_name" placeholder="Họ tên" value="Test User">
        <input type="email" id="reg_email" placeholder="Email" value="test@example.com">
        <input type="tel" id="reg_phone" placeholder="Số điện thoại" value="0123456789">
        <input type="password" id="reg_password" placeholder="Mật khẩu" value="test123456">
        <button onclick="testRegister()">Đăng ký</button>
        <div id="registerResult" class="result" style="display:none;"></div>
    </div>

    <div class="form-section">
        <h2>Đăng nhập (Login)</h2>
        <input type="email" id="login_email" placeholder="Email" value="test@example.com">
        <input type="password" id="login_password" placeholder="Mật khẩu" value="test123456">
        <button onclick="testLogin()">Đăng nhập</button>
        <div id="loginResult" class="result" style="display:none;"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        async function testRegister() {
            const resultDiv = document.getElementById('registerResult');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.textContent = 'Loading...';

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        full_name: document.getElementById('reg_full_name').value,
                        email: document.getElementById('reg_email').value,
                        phone: document.getElementById('reg_phone').value,
                        password: document.getElementById('reg_password').value,
                        role: 'passenger'
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = '✅ Success!\n\n' + JSON.stringify(data, null, 2);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = '❌ Error!\n\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Network Error!\n\n' + error.message;
            }
        }

        async function testLogin() {
            const resultDiv = document.getElementById('loginResult');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.textContent = 'Loading...';

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: document.getElementById('login_email').value,
                        password: document.getElementById('login_password').value
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = '✅ Success!\n\n' + JSON.stringify(data, null, 2);
                    
                    // Store token
                    if (data.data && data.data.token) {
                        localStorage.setItem('token', data.data.token);
                        localStorage.setItem('user', JSON.stringify(data.data.user));
                    }
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = '❌ Error!\n\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Network Error!\n\n' + error.message;
            }
        }
    </script>
</body>
</html>
